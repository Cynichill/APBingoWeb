<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archipelago Bingo</title>
  <script type="module" crossorigin src="/APBingoWeb/assets/index-DGBCFpdq.js"></script>
  <link rel="stylesheet" crossorigin href="/APBingoWeb/assets/index-CBQw5QE8.css">
</head>
<body>

    <!-- Sticky Header with Player Search -->
    <header id="stickyHeader">
        <span id="bingoCounter">0/0 Goal</span>
        <input type="text" id="playerSearch" placeholder="Search player..." />
        <button id="muteButton" aria-label="Toggle sound">🔊</button>
    </header>

    <!-- Side Panel: AP Login -->
    <aside id="sidePanel">
        <button id="menuButton">
            <img alt="Menu">
        </button>

        <div class="panel-content">
            <div class="form-group">
                <label for="hostInput">Host</label>
                <input type="text" id="hostInput">
            </div>

            <div class="form-group">
                <label for="portInput">Port</label>
                <input type="number" id="portInput" min="0" step="1">
            </div>

            <div class="form-group">
                <label for="slotInput">Slotname</label>
                <input type="text" id="slotInput">
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passInput">
            </div>

            <button id="loginButton">Login</button>
            <button id="copyLinkButton" class="hidden">Copy Link</button>
        </div>
    </aside>

    <!-- Console Log Panel -->
    <aside id="logPanel">
        <button id="logMenuButton">
            <img alt="Log">
        </button>
        <div id="logBox"></div>
        <div id="logInputContainer">
            <input type="text" id="logInput" placeholder="Type a message..." />
            <button id="sendLogButton">Send</button>
        </div>
    </aside>

    <!-- Main App Container -->
    <main id="app">
        <div id="viewport">
            <div id="zoomLayer">
                <div id="bingoContainer"></div>
            </div>
        </div>
    </main>

    <!-- Scripts -->

    <!-- Sounds from: nomiqbomi - https://freesound.org/people/nomiqbomi/sounds/578572/ and rhodesmas  - https://freesound.org/people/rhodesmas/sounds/380277/ -->

</body>
</html>
