<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Archipelago Bingo</title>
</head>
<body>

    <!-- Sticky Header with Player Search -->
    <header id="stickyHeader">
        <span id="bingoCounter">0/0 Goal</span>
        <input type="text" id="playerSearch" placeholder="Search player..." />
        <button id="muteButton" aria-label="Toggle sound">🔊</button>
    </header>

    <!-- Side Panel: AP Login + Text Client -->
    <aside id="sidePanel">
        <button id="menuButton">
            <img alt="Menu">
        </button>

        <div class="panel-content">
            <!-- Collapsible: Connection -->
            <div class="panel-section" id="loginSection">
                <button class="panel-section-header" aria-expanded="true">
                    <span>Connection</span>
                    <span class="panel-chevron">▼</span>
                </button>
                <div class="panel-section-body">
                    <div class="form-group">
                        <label for="hostInput">Host</label>
                        <input type="text" id="hostInput">
                    </div>

                    <div class="form-group">
                        <label for="portInput">Port</label>
                        <input type="number" id="portInput" min="0" step="1">
                    </div>

                    <div class="form-group">
                        <label for="slotInput">Slotname</label>
                        <input type="text" id="slotInput">
                    </div>

                    <div class="form-group">
                        <label for="passwordInput">Password</label>
                        <input type="password" id="passInput">
                    </div>

                    <button id="loginButton">Login</button>
                    <button id="copyLinkButton" class="hidden">Copy Link</button>
                </div>
            </div>

            <!-- Collapsible: Settings -->
            <div class="panel-section collapsed" id="settingsSection">
                <button class="panel-section-header" aria-expanded="false">
                    <span>Settings</span>
                    <span class="panel-chevron">▼</span>
                </button>
                <div class="panel-section-body">
                    <div class="form-group">
                        <label for="themeSelect">Theme</label>
                        <select id="themeSelect">
                            <option value="">Default</option>
                            <option value="amethyst">Amethyst</option>
                            <option value="ember">Ember</option>
                            <option value="seafoam">Seafoam</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Collapsible: Text Client -->
            <div class="panel-section collapsed" id="textClientSection">
                <button class="panel-section-header" aria-expanded="false">
                    <span>Text Client</span>
                    <span class="panel-chevron">▼</span>
                </button>
                <div class="panel-section-body">
                    <div id="textClientLog"></div>
                    <div id="textClientInput">
                        <input type="text" id="textClientMessage" placeholder="Type a message..." />
                        <button id="textClientSend">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main App Container -->
    <main id="app">
        <div id="viewport">
            <div id="zoomLayer">
                <div id="bingoContainer"></div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="./src/main.ts"></script>

    <!-- Sounds from: nomiqbomi - https://freesound.org/people/nomiqbomi/sounds/578572/ and rhodesmas  - https://freesound.org/people/rhodesmas/sounds/380277/ -->

</body>
</html>
